name: Deploy

on:
  workflow_dispatch:  
  pull_request:
    branches: [ release ]
    types: [ closed ]

jobs:
  build-docker-image:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Build with Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mymate:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mymate:latest

  run-docker-image-on-ec2:
    needs: build-docker-image
    runs-on: [ self-hosted ]

    steps:
      # (필수) compose 파일 존재 체크
      - name: Check compose file exists
        run: test -f /home/ubuntu/docker-compose.yml || (echo "❌ /home/ubuntu/docker-compose.yml not found" && exit 1)

      # 🔐 시크릿에서 멀티라인 .env 복원
      - name: Write .env file from secret
        run: |
          sudo mkdir -p /home/ubuntu
          printf '%s' "${{ secrets.ENV_PROD }}" | sudo tee /home/ubuntu/.env > /dev/null
          sudo chmod 600 /home/ubuntu/.env

      # 🔐 firebase-admin.json을 시크릿에서 복원 (원문 JSON 그대로, heredoc으로 안전하게)
      - name: Remove firebase-admin.json directory if exists
        run: sudo rm -rf /home/ubuntu/firebase-admin.json
    
      - name: Write firebase-admin.json from secret
        run: | 
          set -e
          sudo mkdir -p /home/ubuntu
          # 시크릿 원문을 그대로 파일로 저장 (셸 확장/이스케이프 방지)
          cat > /home/ubuntu/firebase-admin.json <<'JSON'
          ${{ secrets.FIREBASE_ADMIN_JSON }} JSON
          # CRLF가 포함됐다면 LF로 변환
          if command -v dos2unix >/dev/null 2>&1; then sudo dos2unix /home/ubuntu/firebase-admin.json; fi
          # JSON 유효성 검사 (jq 없으면 설치 시도)
          if ! command -v jq >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y jq; fi
          sudo jq -e . /home/ubuntu/firebase-admin.json >/dev/null
          sudo chmod 400 /home/ubuntu/firebase-admin.json

      - name: Compose down
        working-directory: /home/ubuntu
        run: sudo docker compose --env-file .env down || true

      - name: Pull new image
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mymate:latest

      - name: Compose up
        working-directory: /home/ubuntu
        run: sudo docker compose --env-file .env up -d --remove-orphans

      - name: Prune old images
        run: sudo docker system prune -f
