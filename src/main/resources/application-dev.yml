spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}



jwt:
  secret: "your-super-secret-key-that-should-be-long-and-secure-for-development"
  expirationMs: 7200000 # 2시간 (밀리초)
  refreshTokenExpirationMs: 2592000000 # 30일 (밀리초)
  tokenPrefix: "Bearer "
  issuer: "tourapi"
  audiences:
    - "web"
    - "mobile"

# 개발 환경에서 기본 관리자 계정
seed:
  admin:
    enabled: true
    email: "admin@local.dev"
    userId: "admin"
    username: "Admin"
    password: "admin1234"

