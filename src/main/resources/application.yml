token:
  store:
    impl: lua
  refresh:
    ttl-seconds: 1209600
  hmac-secret: ${REFRESH_HMAC_SECRET:dev-change-me-please}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 기본 dev
    include: oauth
    # 필요시 password, timeout 등 추가 가능
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

# 로그 설정
logging:
  level:
    root: INFO
    com.mymate: INFO
    org.springframework.data.redis: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure: WARN



# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-that-should-be-long-and-secure-at-least-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}  # 30분 (30 * 60 * 1000)
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}  # 14일 (14 * 24 * 60 * 60 * 1000)
  token-prefix: Bearer
  issuer: mymate-server
  audiences:
    - mymate-client

solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  default-from: ${SOLAPI_DEFAULT_FROM:}



# 관리자 계정 시드 설정 (프로필별로 오버라이드 가능)
seed:
  admin:
    enabled: ${SEED_ADMIN_ENABLED:true}
    email: ${SEED_ADMIN_EMAIL:admin@example.com}
    userId: ${SEED_ADMIN_USERID:admin}
    username: ${SEED_ADMIN_USERNAME:Administrator}
    password: ${SEED_ADMIN_PASSWORD:change-me}

