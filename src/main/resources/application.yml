token:
  store:
    impl: lua
  refresh:
    ttl-seconds: 1209600
  hmac-secret: ${REFRESH_HMAC_SECRET:dev-change-me-please}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 기본 dev
    include: oauth
    # 필요시 password, timeout 등 추가 가능
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

# 로그 설정
logging:
  level:
    root: INFO
    com.mymate: INFO
    org.springframework.data.redis: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure: WARN



# 공통 설정이 있다면 여기에
jwt:
  secret: your-super-secret-key-that-should-be-long-and-secure

solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  default-from: ${SOLAPI_DEFAULT_FROM:}

# FCM 설정 (서비스 계정 키 경로 및 기본 주제/타임아웃 등)
fcm:
  project-id: ${FCM_PROJECT_ID:}
  service-account-key-path: ${FCM_SERVICE_ACCOUNT_KEY_PATH:}

# 관리자 계정 시드 설정 (프로필별로 오버라이드 가능)
seed:
  admin:
    enabled: ${SEED_ADMIN_ENABLED:true}
    email: ${SEED_ADMIN_EMAIL:admin@example.com}
    userId: ${SEED_ADMIN_USERID:admin}
    username: ${SEED_ADMIN_USERNAME:Administrator}
    password: ${SEED_ADMIN_PASSWORD:change-me}

